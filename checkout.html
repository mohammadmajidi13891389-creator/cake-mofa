<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تکمیل سفارش | cakemofa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Vazirmatn", sans-serif;
            background: linear-gradient(135deg, #fff7fa, #fff);
            color: #402f35;
        }

        header {
            height: 75px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #f3dce5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #d6537c;
            font-size: 24px;
            font-weight: 800;
        }

        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 50%;
        }

        .back {
            text-decoration: none;
            color: #9b6878;
            font-size: 14px;
        }

        .container {
            width: min(1100px, 92%);
            margin: 40px auto 70px;
        }

        h1 {
            margin-bottom: 30px;
            color: #49343c;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 25px;
        }

        .box {
            background: white;
            border: 1px solid #f0dce4;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 35px rgba(190, 100, 130, 0.08);
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #806570;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ead6de;
            border-radius: 12px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #dc6688;
            box-shadow: 0 0 0 3px rgba(220, 102, 136, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid #f3e7eb;
        }

        .item-name {
            font-weight: 600;
            font-size: 14px;
        }

        .item-quantity {
            color: #987783;
            font-size: 13px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            font-size: 14px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #806570;
        }

        .discount {
            color: #299357;
        }

        .total {
            border-top: 1px solid #eadce1;
            margin-top: 10px;
            padding-top: 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 18px;
            font-weight: 800;
        }

        .total-price {
            color: #d6537c;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #dc6688, #c94f73);
            color: white;
            padding: 15px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 22px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #b83b3b;
        }

        .message.success {
            display: block;
            background: #e2f8e9;
            color: #24854a;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
        }

        .empty a {
            display: inline-block;
            margin-top: 15px;
            color: #d6537c;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .row {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <img
            src="https://imglink.cc/cdn/MRI-pwqIUq.png"
            alt="cakemofa"
        >

        <span>cakemofa</span>
    </div>

    <a class="back" href="cart.html">
        ← بازگشت به سبد خرید
    </a>

</header>


<main class="container">

    <h1>
        تکمیل سفارش 🎂
    </h1>

    <div id="message" class="message"></div>


    <div id="checkoutContent">

        <div class="layout">

            <!-- اطلاعات مشتری -->

            <section class="box">

                <h2>
                    اطلاعات تحویل
                </h2>

                <form id="checkoutForm">

                    <div class="field">

                        <label>
                            نام و نام خانوادگی *
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            required
                            placeholder="مثلاً محمد محمدی"
                        >

                    </div>


                    <div class="field">

                        <label>
                            شماره موبایل *
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            required
                            placeholder="09123456789"
                            maxlength="11"
                        >

                    </div>


                    <div class="row">

                        <div class="field">

                            <label>
                                استان
                            </label>

                            <input
                                type="text"
                                id="province"
                                placeholder="مثلاً تهران"
                            >

                        </div>


                        <div class="field">

                            <label>
                                شهر
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="مثلاً تهران"
                            >

                        </div>

                    </div>


                    <div class="field">

                        <label>
                            آدرس کامل *
                        </label>

                        <textarea
                            id="address"
                            required
                            placeholder="آدرس دقیق محل تحویل..."
                        ></textarea>

                    </div>


                    <div class="field">

                        <label>
                            کد پستی
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            maxlength="10"
                            placeholder="کد پستی ۱۰ رقمی"
                        >

                    </div>


                    <div class="field">

                        <label>
                            توضیحات سفارش
                        </label>

                        <textarea
                            id="notes"
                            placeholder="مثلاً زمان مناسب برای تحویل..."
                        ></textarea>

                    </div>


                    <button
                        class="submit-btn"
                        id="submitButton"
                        type="submit"
                    >
                        💳 پرداخت آنلاین
                    </button>

                </form>

            </section>


            <!-- خلاصه سفارش -->

            <section class="box">

                <h2>
                    خلاصه سفارش
                </h2>

                <div id="items"></div>


                <div class="summary-line">

                    <span>
                        مبلغ کالاها
                    </span>

                    <span id="subtotal">
                        ۰ تومان
                    </span>

                </div>


                <div
                    class="summary-line discount"
                    id="discountRow"
                    style="display:none;"
                >

                    <span id="discountText">
                        تخفیف
                    </span>

                    <span id="discountAmount">
                        ۰ تومان
                    </span>

                </div>


                <div class="total">

                    <span>
                        مبلغ نهایی
                    </span>

                    <span
                        class="total-price"
                        id="total"
                    >
                        ۰ تومان
                    </span>

                </div>

            </section>

        </div>

    </div>

</main>


<script>

    // =====================================
    // قیمت محصولات
    // =====================================

    const productPrices = {

        "کیک ردولوت": 1000000,

        "کیک دارک چاکلت": 1200000,

        "کیک اسنیکرز": 1300000

    };


    // =====================================
    // فرمت قیمت
    // =====================================

    function formatPrice(price) {

        return Number(price).toLocaleString("fa-IR") + " تومان";

    }


    // =====================================
    // دریافت سبد خرید
    // =====================================

    const cart =
        JSON.parse(
            localStorage.getItem("cakemofa_cart")
        ) || [];


    // =====================================
    // اگر سبد خالی باشد
    // =====================================

    if (cart.length === 0) {

        document.getElementById("checkoutContent").innerHTML = `

            <div class="box empty">

                <div style="font-size:50px;">
                    🛒
                </div>

                <h2>
                    سبد خرید خالی است
                </h2>

                <p>
                    ابتدا یک محصول به سبد خرید اضافه کن.
                </p>

                <a href="index.html">
                    رفتن به فروشگاه
                </a>

            </div>

        `;

    }


    // =====================================
    // گروه‌بندی محصولات
    // =====================================

    function getGroupedItems() {

        const grouped = {};


        cart.forEach(item => {

            if (!grouped[item.name]) {

                grouped[item.name] = {

                    name: item.name,

                    price:
                        productPrices[item.name] ||
                        Number(item.price) ||
                        0,

                    quantity: 0

                };

            }


            grouped[item.name].quantity++;

        });


        return Object.values(grouped);

    }


    // =====================================
    // نمایش سفارش
    // =====================================

    const groupedItems =
        getGroupedItems();


    let subtotal = 0;


    const itemsContainer =
        document.getElementById("items");


    if (itemsContainer) {

        groupedItems.forEach(item => {

            const itemTotal =
                item.price * item.quantity;


            subtotal += itemTotal;


            const div =
                document.createElement("div");


            div.className = "item";


            div.innerHTML = `

                <div>

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-quantity">
                        تعداد:
                        ${item.quantity.toLocaleString("fa-IR")}
                    </div>

                </div>


                <div class="item-price">
                    ${formatPrice(itemTotal)}
                </div>

            `;


            itemsContainer.appendChild(div);

        });

    }


    // =====================================
    // تخفیف
    // =====================================

    const discountPercent =
        Number(
            localStorage.getItem("cakemofa_discount")
        ) || 0;


    const discountAmount =
        Math.round(
            subtotal * discountPercent / 100
        );


    const finalTotal =
        subtotal - discountAmount;


    document.getElementById("subtotal").textContent =
        formatPrice(subtotal);


    document.getElementById("total").textContent =
        formatPrice(finalTotal);


    if (discountPercent > 0) {

        document.getElementById("discountRow").style.display =
            "flex";


        document.getElementById("discountText").textContent =
            `تخفیف (${discountPercent}٪)`;


        document.getElementById("discountAmount").textContent =
            "-" + formatPrice(discountAmount);

    }


    // =====================================
    // ارسال سفارش به سرور
    // =====================================

    const checkoutForm =
        document.getElementById("checkoutForm");


    if (checkoutForm) {

        checkoutForm.addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();


                const submitButton =
                    document.getElementById("submitButton");


                const message =
                    document.getElementById("message");


                // -----------------------------
                // اطلاعات مشتری
                // -----------------------------

                const customerName =
                    document
                        .getElementById("customerName")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const province =
                    document
                        .getElementById("province")
                        .value
                        .trim();


                const city =
                    document
                        .getElementById("city")
                        .value
                        .trim();


                const address =
                    document
                        .getElementById("address")
                        .value
                        .trim();


                const postalCode =
                    document
                        .getElementById("postalCode")
                        .value
                        .trim();


                const notes =
                    document
                        .getElementById("notes")
                        .value
                        .trim();


                // -----------------------------
                // بررسی شماره موبایل
                // -----------------------------

                if (!/^09\d{9}$/.test(phone)) {

                    message.className =
                        "message error";


                    message.textContent =
                        "لطفاً یک شماره موبایل معتبر وارد کنید.";


                    return;

                }


                // -----------------------------
                // غیرفعال کردن دکمه
                // -----------------------------

                submitButton.disabled = true;


                submitButton.textContent =
                    "⏳ در حال اتصال به درگاه...";


                // -----------------------------
                // ارسال به سرور
                // -----------------------------

                try {

                    const response =
                        await fetch(
                            "/api/orders",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    customer_name:
                                        customerName,

                                    phone:
                                        phone,

                                    province:
                                        province,

                                    city:
                                        city,

                                    address:
                                        address,

                                    postal_code:
                                        postalCode,

                                    notes:
                                        notes,

                                    items:
                                        groupedItems,

                                    total:
                                        finalTotal,

                                    discount_percent:
                                        discountPercent

                                })

                            }
                        );


                    const data =
                        await response.json();


                    // -----------------------------
                    // بررسی پاسخ سرور
                    // -----------------------------

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(

                            data.message ||
                            "ایجاد سفارش و پرداخت ناموفق بود."

                        );

                    }


                    // -----------------------------
                    // انتقال به زرین‌پال
                    // -----------------------------

                    if (data.payment_url) {

                        window.location.href =
                            data.payment_url;

                        return;

                    }


                    throw new Error(
                        "لینک پرداخت از سرور دریافت نشد."
                    );


                } catch (error) {

                    console.error(
                        "Checkout error:",
                        error
                    );


                    message.className =
                        "message error";


                    message.textContent =
                        error.message ||
                        "خطایی در ایجاد پرداخت رخ داد.";


                    submitButton.disabled =
                        false;


                    submitButton.textContent =
                        "💳 پرداخت آنلاین";

                }

            }
        );

    }

</script>

</body>

</html>
